server:
  port: 8080

# -------------------------------------------------------
# GenAI configuration
# -------------------------------------------------------
genai:
  # All values can be set via -D flags or environment variables:
  #   mvn spring-boot:run -Dgenai.api-key=<your-api-key> -Dgenai.base-url=https://... -Dgenai.model=qwen-plus
  #
  # Or via environment variables:
  #   export GENAI_API_KEY=<your-api-key>
  #   export GENAI_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
  #   export GENAI_PROVIDER=dashscope
  #   export GENAI_MODEL=qwen-plus
  api-key: ${GENAI_API_KEY:<your-api-key>}
  base-url: ${GENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  provider: ${GENAI_PROVIDER:dashscope}
  model: ${GENAI_MODEL:qwen-plus}
  temperature: ${GENAI_TEMPERATURE:0.7}
  max-tokens: ${GENAI_MAX_TOKENS:1024}

# -------------------------------------------------------
# GenAI semconv stability opt-in
# Required to enable experimental content capturing modes
# (span_only, event_only, span_and_event).
# Without this, only "true" (= span_only) is recognized.
# -------------------------------------------------------
otel.semconv.stability.opt.in: gen_ai_latest_experimental

# -------------------------------------------------------
# GenAI content capturing
# Controls whether input/output messages are recorded in spans and events.
#
# Stable mode (without opt-in above):
#   true  -> capture on spans (backward compatible)
#   false -> no capture (default)
#
# Experimental mode (with opt-in above):
#   no_content     -> no capture (default)
#   span_only      -> capture on span attributes
#   event_only     -> capture via log events (recommended)
#   span_and_event -> capture on both
# -------------------------------------------------------
otel.instrumentation.genai:
  capture.message.content: span_and_event
  emit.event: true

# -------------------------------------------------------
# OpenTelemetry SDK configuration
# These properties are bridged into AutoConfiguredOpenTelemetrySdk
# at startup. Changes here take effect on restart.
#
# Reference: https://opentelemetry.io/docs/languages/java/configuration/
#   export OTEL_RESOURCE_ATTRIBUTES=service.name=<your-service-name>,acs.cms.workspace=<your-workspace>,service.version=<your-version>,deployment.environment=<your-environment>
#   export OTEL_EXPORTER_OTLP_HEADERS=x-arms-license-key=<your-license-key>,x-arms-project=<your-project>,x-cms-workspace=<your-workspace>
#   export OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=https://<your-project>.<region>.log.aliyuncs.com/apm/trace/opentelemetry/v1/traces
#   export OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=https://<your-project>.<region>.log.aliyuncs.com/apm/trace/opentelemetry/v1/metrics
# -------------------------------------------------------
otel:
  service:
    name: ${OTEL_SERVICE_NAME:genai-example}
  resource:
    attributes: ${OTEL_RESOURCE_ATTRIBUTES:service.name=<your-service-name>,acs.cms.workspace=<your-workspace>,service.version=<your-version>,deployment.environment=<your-environment>}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:otlp}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:otlp}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:none}
  metric:
    export:
      interval: ${OTEL_METRIC_EXPORT_INTERVAL:5000}
  exporter:
    otlp:
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
      headers: ${OTEL_EXPORTER_OTLP_HEADERS:x-arms-license-key=<your-license-key>,x-arms-project=<your-project>,x-cms-workspace=<your-workspace>}
      traces:
        endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:https://<your-project>.<region>.log.aliyuncs.com/apm/trace/opentelemetry/v1/traces}
      metrics:
        endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:https://<your-project>.<region>.log.aliyuncs.com/apm/trace/opentelemetry/v1/metrics}
